<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="odaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="50%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Rounded Squircle Background -->
  <rect width="64" height="64" rx="16" fill="url(#odaGrad)" />
  
  <!-- Outer glowing border -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>

  <!-- Stylized 'O' + Bag Handle Accent -->
  <g filter="url(#shadow)">
    <!-- Stylized Bag Handle -->
    <path d="M26 23 C26 18, 38 18, 38 23" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Outer Ring of 'O' -->
    <circle cx="32" cy="36" r="14" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
    
    <!-- Modern Sparkle / Accent on top right of 'O' -->
    <circle cx="43" cy="25" r="2.5" fill="#FEF08A"/>
  </g>
</svg>
